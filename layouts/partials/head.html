<!-- Chemin exact : layouts/partials/head.html -->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- 1. SEO Dynamique géré par la Quality Gate YMYL (index / noindex) et URL Canonique -->
<title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} | {{ .Site.Title }}{{ end }}</title>
<meta name="description" content="{{ .Params.description | default .Site.Params.description }}">
<meta name="robots" content="{{ if .IsHome }}index, follow{{ else }}{{ .Params.seo_index | default "noindex" }}{{ end }}">
<link rel="canonical" href="{{ .Permalink }}">

<!-- 2. Balises Open Graph (Partage B2B SaaS / DPO / Ingénierie) -->
<meta property="og:title" content="{{ .Title | default .Site.Title }}">
<meta property="og:description" content="{{ .Params.description | default .Site.Params.description }}">
<meta property="og:type" content="{{ if .IsPage }}article{{ else }}website{{ end }}">
<meta property="og:url" content="{{ .Permalink }}">
{{ if .Params.image }}
<meta property="og:image" content="{{ .Params.image | absURL }}">
{{ end }}

<!-- 3. Données Structurées JSON-LD Schema.org (TechArticle factuel, zéro avis ou note inventés) -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "TechArticle",
  "headline": "{{ .Title | default .Site.Title }}",
  "description": "{{ .Params.description | default .Site.Params.description }}",
  "url": "{{ .Permalink }}",
  "datePublished": "{{ .Date.Format "2006-01-02T15:04:05Z07:00" }}",
  "dateModified": "{{ .Lastmod.Format "2006-01-02T15:04:05Z07:00" }}",
  "author": {
    "@type": "Organization",
    "name": "{{ .Site.Params.author | default "Vecteur A3 Technical Research" }}"
  }
}
</script>

<!-- 4. Point d'intégration Analytics sans cookie (piloté dynamiquement depuis hugo.toml) -->
{{ if .Site.Params.analytics_domain }}
<script defer data-domain="{{ .Site.Params.analytics_domain }}" src="{{ .Site.Params.analytics_script_url | default "https://plausible.io/js/script.outbound-links.tagged-events.js" }}"></script>
{{ end }}

<!-- 5. Identité Visuelle & Favicons (Palette Deep Teal #0d9488) -->
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#0d9488">
