# Chemin exact : .github/workflows/keepalive.yml
name: Vecteur A3 - Keepalive Natif (Anti-Inactivité 60 Jours)

on:
  workflow_dispatch:
  schedule:
    - cron: '41 4 2,16 * *'

permissions:
  contents: read

concurrency:
  group: "a3-keepalive-maintenance"
  cancel-in-progress: false

jobs:
  keepalive:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Maintien d'activité des workflows via l'API REST officielle GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Vérification et maintien d'activité des workflows planifiés pour ${{ github.repository }}..."
          for WF_FILE in "main.yml" "keepalive.yml"; do
            echo "Envoi du signal d'activation API pour ${WF_FILE}..."
            gh api \
              --method PUT \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "/repos/${{ github.repository }}/actions/workflows/${WF_FILE}/enable"
            echo "Workflow ${WF_FILE} confirmé actif."
          done
